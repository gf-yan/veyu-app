syntax = "proto3";

package veyu.v1;

import "frame.proto";

option java_package = "app.veyu.protocol.v1";
option java_multiple_files = true;

// The api's HTTP interface: signing in, access tokens, and an account's devices.
//
// Every request and response body is one of these messages as binary protobuf,
// Content-Type application/x-protobuf. A request that fails gets a non-2xx
// status and a Failure (frame.proto) as its body, with the same error codes the
// gateway uses.
//
// Endpoints that act for a device take its access token as
// "Authorization: Bearer <token>".
//
// How a device stays signed in: signing in once gives it a device credential,
// kept in the platform's secure storage. The credential gets access tokens,
// which last minutes and are what the gateway and the api accept. It is
// never rotated, so a lost response can never strand a device; it stops
// working only when the device is removed or the account is disabled, and
// then the device signs in again.

// POST /v1/sign-in/apple -> SignedIn
//
// Signs in with Apple, creating the account the first time. Registers the
// device, or -- when the same device (by identity key) signs in again, as a
// retry after a lost response would -- gives it a new credential instead of a
// second registration.
message AppleSignInRequest {
  // The identity token Sign in with Apple returned to the app.
  string identity_token = 1;
  // The nonce the app generated for this sign-in; Apple was given its SHA-256,
  // hex, and put that in the identity token. Proves the token was made for
  // this request, so a leaked one cannot be replayed.
  string nonce = 2;
  NewDevice device = 3;
  // When the account already has as many devices as it may, the sign-in is
  // refused with DEVICE_LIMIT and the list; the app asks which to replace and
  // signs in again naming it. 0 when not replacing.
  uint32 replace_device_id = 4;
}

message NewDevice {
  // libsignal's registration id for this install, 1..16380.
  uint32 registration_id = 1;
  // libsignal's serialized identity public key, 33 bytes.
  bytes identity_key = 2;
  DevicePlatform platform = 3;
  // What the user calls this device, up to 64 characters.
  string name = 4;
  // Required. A device is registered with the keys a peer needs to start a
  // session with it: every encrypted send must carry a copy for every device,
  // so a device nobody could encrypt for would block all messages to its
  // account. Persist the private halves before signing in.
  SignedPreKey signed_pre_key = 5;
  SignedPreKey kyber_pre_key = 6;
}

message SignedIn {
  uint64 account_id = 1;
  uint32 device_id = 2;
  // Keep in secure storage, never in logs; it gets this device's access tokens.
  bytes device_credential = 3;
  AccessToken access_token = 4;
}

message AccessToken {
  string token = 1;
  int64 expires_at_ms = 2;
}

// POST /v1/tokens -> AccessToken
message TokenRequest {
  uint64 account_id = 1;
  uint32 device_id = 2;
  bytes device_credential = 3;
}

// GET /v1/devices -> DeviceList (frame.proto)
//
// DELETE /v1/devices/{device_id} -> 204
//
// Removes a device of the caller's account, the calling one included. Its
// credential stops working at once; its socket closes when its access token
// expires, and messages sent after the removal are not encrypted for it.

// ---------------------------------------------------------------- key directory
//
// What a peer needs to open a libsignal session with each of an account's
// devices. The server never holds a private key; what it guards is that it
// never hands out the wrong key, or the same one-time key twice:
//
//   - Key ids only ever rise, per device and per kind. A reused id could name a
//     key whose private half the device has already discarded.
//   - A one-time prekey is handed out once, then deleted.
//   - An exhausted pool is not a failure: the bundle comes without a one-time
//     prekey, and the session still opens.

// A signed prekey: the EC one (33-byte public key, 0x05 type byte) or the
// Kyber1024 one (1569 bytes, 0x08), each signed by the identity key.
message SignedPreKey {
  uint32 key_id = 1;
  bytes public_key = 2;
  bytes signature = 3;
}

message OneTimePreKey {
  uint32 key_id = 1;
  // 33 bytes, 0x05 type byte.
  bytes public_key = 2;
}

// PUT /v1/keys/signed -> KeyStatus
//
// Replaces this device's signed prekey, Kyber prekey, or both. Each id must be
// above the one it replaces.
message SignedPreKeys {
  SignedPreKey signed_pre_key = 1;
  SignedPreKey kyber_pre_key = 2;
}

// POST /v1/keys/one-time -> KeyStatus
//
// Adds one-time prekeys to this device's pool, ids rising and above every id
// uploaded before. Refused with INVALID if the pool would exceed its size.
message OneTimePreKeys {
  repeated OneTimePreKey keys = 1;
}

// GET /v1/keys -> KeyStatus: this device's keys, to decide what to upload.
message KeyStatus {
  // One-time prekeys left in the pool. Top it up well before it empties.
  uint32 one_time_pre_keys = 1;
  uint32 max_one_time_pre_keys = 2;
  uint32 signed_pre_key_id = 3;
  uint32 kyber_pre_key_id = 4;
  // The highest one-time prekey id ever uploaded; new ones must be above it.
  uint32 last_one_time_pre_key_id = 5;
}

// GET /v1/keys/{account_id} -> PreKeyBundles
//
// A bundle for every device of an account, each taking one of its one-time
// prekeys. An account with no devices gets an empty list.
message PreKeyBundles {
  repeated PreKeyBundle bundles = 1;
}

message PreKeyBundle {
  uint32 device_id = 1;
  uint32 registration_id = 2;
  bytes identity_key = 3;
  SignedPreKey signed_pre_key = 4;
  SignedPreKey kyber_pre_key = 5;
  // Absent when the pool is empty.
  OneTimePreKey one_time_pre_key = 6;
}
