syntax = "proto3";

package veyu.v1;

option java_package = "app.veyu.protocol.v1";
option java_multiple_files = true;

// The client-to-gateway wire format.
//
// One TLS WebSocket per device, on 443, straight to a gateway the client was
// told to use by endpoint discovery -- no reverse proxy in front of it, because
// proxying long connections doubles the connection count on the way in.
//
// Every message on that socket is one Frame, as a binary WebSocket message.
// WebSocket already delimits messages, so there is no length prefix here.
//
// Compression is off. The payloads that matter are ciphertext, which is
// incompressible, so permessage-deflate would burn CPU on every message to save
// nothing. Turn it off explicitly; some stacks enable it by default.

message Frame {
  // Assigned by whichever side sends a request, echoed on the reply. Lets the
  // client match acknowledgements without ordering assumptions, because
  // responses do not necessarily come back in the order requests went out.
  uint64 id = 1;

  oneof payload {
    Connect connect = 10;
    Connected connected = 11;
    Ping ping = 12;
    Pong pong = 13;
    Failure failure = 14;

    SendMessage send = 20;
    SendAck send_ack = 21;
    Deliver deliver = 22;
    DeliveryAck delivery_ack = 23;

    SyncRequest sync = 30;
    SyncResponse sync_response = 31;

    ReadReceipt read_receipt = 40;
    Typing typing = 41;
  }
}

// ---------------------------------------------------------------- session

// Sent once, first, before anything else on the socket. Authenticates the
// device and settles the parameters the rest of the session runs under.

message Connect {
  // The gateway verifies this by itself. It holds no database connection, so
  // anything it needs to authorise a socket has to be inside the token.
  string access_token = 1;

  // Which of this account's devices is connecting. libsignal addresses a
  // session as (account, device), and the product allows two devices.
  uint32 device_id = 2;

  // Bumped when the frame format changes incompatibly. The gateway refuses
  // rather than guesses.
  uint32 protocol_version = 3;

  // Present when resuming after a drop, so the gateway can decide whether the
  // client needs a full sync or just the tail.
  optional ResumeState resume = 4;
}

message ResumeState {
  // The highest envelope this device has stored, as a millisecond timestamp.
  // Paired with the per-conversation cursors in a SyncRequest.
  int64 last_envelope_at = 1;
}

message Connected {
  // Server time, so the client can correct a skewed local clock before it
  // stamps anything.
  int64 server_time_ms = 1;

  // How long the client may stay silent before the gateway considers the
  // socket dead. The client pings at a fraction of this; the server owns the
  // number so it can be tuned under load without shipping an app release.
  uint32 heartbeat_interval_ms = 2;

  // True when this device has messages waiting that it has not synced.
  bool sync_required = 3;

  // The limits this server enforces, which the client respects instead of
  // carrying its own copy. The server owns them so that one definition applies
  // to every client version and a limit can change without an app release.
  Limits limits = 4;
}

message Limits {
  // Largest plaintext body, or largest single ciphertext, in bytes.
  uint32 max_body_bytes = 1;
  // Most ciphertexts one encrypted send may carry.
  uint32 max_ciphertexts = 2;
  // Sends the client may have outstanding on one socket before waiting for
  // acknowledgements; more are refused with TOO_MANY_IN_FLIGHT.
  uint32 max_sends_in_flight = 3;
  // Largest SyncRequest.limit honoured.
  uint32 max_sync_limit = 4;
  // How long the server remembers a client_message_id. A send still
  // unacknowledged after this long is abandoned, not retried.
  uint64 dedupe_window_ms = 5;
}

message Ping {
  int64 client_time_ms = 1;
}

message Pong {
  int64 client_time_ms = 1;
  int64 server_time_ms = 2;
}

message Failure {
  // Stable and machine-readable. Human text is the client's job, in the
  // client's language -- the server does not know which of the five it should
  // use.
  ErrorCode code = 1;
  // For logs and bug reports, in English. Never shown to a user, never parsed.
  string detail = 2;
  // True when retrying the same frame could succeed.
  bool retryable = 3;
  // Present with code DEVICE_MISMATCH: what the sender's fan-out got wrong.
  DeviceMismatch device_mismatch = 4;
}

// An encrypted send must carry exactly one ciphertext for every device in the
// conversation other than the sending one. When it does not, the send is
// refused with this, and the client corrects its device list and sessions and
// sends again under the same client_message_id.
message DeviceMismatch {
  // Devices that exist and got no ciphertext. Fetch their prekeys, open a
  // session, encrypt for them too.
  repeated DeviceAddress missing = 1;
  // Ciphertexts for devices that do not exist, or not in this conversation.
  // Drop the session.
  repeated DeviceAddress extra = 2;
  // Devices that exist under the same id but were registered again -- a
  // reinstall. The session the sender holds is with a device that is gone, so
  // the recipient could never decrypt it. Discard the session and start over.
  repeated DeviceAddress stale = 3;
}

message DeviceAddress {
  uint64 account_id = 1;
  uint32 device_id = 2;
}

// ---------------------------------------------------------------- sending

message SendMessage {
  uint64 conversation_id = 1;

  // Sixteen random bytes, assigned by the client and stable across retries. A
  // reconnect mid-send is ordinary, so the server deduplicates on this rather
  // than creating a second message: a retry of a send that did go through gets
  // the original acknowledgement back, same seq, same timestamp.
  //
  // The server remembers an id for 24 hours. A send still unacknowledged after
  // that is abandoned, not retried; a retry past the window would be stored as
  // a second message.
  bytes client_message_id = 2;

  MessageKind kind = 3;

  oneof content {
    // A direct conversation: one ciphertext per recipient device, produced by
    // the sender. The server cannot make these itself -- it has no key -- so
    // the fan-out is computed on the device and uploaded together.
    EncryptedContent encrypted = 4;

    // A group conversation, which is deliberately not encrypted so that
    // history, search and moderation remain possible.
    bytes plaintext = 5;
  }
}

message EncryptedContent {
  repeated DeviceCiphertext copies = 1;
}

message DeviceCiphertext {
  uint64 target_account_id = 1;
  uint32 target_device_id = 2;
  // libsignal's CiphertextMessageType: 2 is a ratchet message, 3 opens a
  // session.
  uint32 ciphertext_type = 3;
  bytes ciphertext = 4;
  // The registration id of the device the sender's session is with. A device
  // id is reused when an app is reinstalled; the registration id is not, so
  // this is how the server notices a ciphertext addressed to a device that no
  // longer exists under that id. Required on send, absent on delivery.
  uint32 target_registration_id = 5;
}

// Sent once the message is durable, and before it has been pushed to anyone.
// Fan-out is a latency optimisation; delivery is guaranteed by the sync
// protocol, not by the push.
message SendAck {
  bytes client_message_id = 1;
  uint64 seq = 2;
  int64 created_at_ms = 3;
}

// ---------------------------------------------------------------- receiving

// A message, as pushed while the device is connected and as returned by sync.
// The same message can arrive both ways, and a push can arrive after the sync
// that already returned it; the client keeps one copy per (conversation, seq).
message Deliver {
  uint64 conversation_id = 1;
  // Display order within the conversation. Not the sync position: see
  // ConversationCursor.
  uint64 seq = 2;
  uint64 sender_account_id = 3;
  uint32 sender_device_id = 4;
  MessageKind kind = 5;
  int64 created_at_ms = 6;

  oneof content {
    // Addressed to this device specifically.
    DeviceCiphertext encrypted = 7;
    bytes plaintext = 8;
  }

  // The sender's id for the message. In a rare failure -- a send that did
  // reach the server but whose acknowledgement was lost, retried long enough
  // afterwards to be stamped again -- one message is stored twice under two
  // sequence numbers. Clients show one message per (sender, client_message_id).
  bytes client_message_id = 9;
}

// The client confirms it has stored the message. Until this arrives the
// message stays in the device's sync window.
message DeliveryAck {
  uint64 conversation_id = 1;
  uint64 seq = 2;
}

// ---------------------------------------------------------------- sync

// Everything stored for this device since it last synced, conversation by
// conversation.
//
// The client sends back the cursors from its previous SyncResponse, one per
// conversation it knows. Conversations it has no cursor for -- new ones, or all
// of them on a new device -- are synced from the start of retention (from
// joining, for a group).
//
// Push is not a substitute. A pushed message is stored and shown, but it never
// moves a cursor: pushes are best effort and can arrive out of order, and a
// cursor moved past a message that has not arrived yet would skip it for good.
message SyncRequest {
  repeated ConversationCursor cursors = 1;

  // Replaced by the time carried inside each cursor.
  reserved 2;
  reserved "since_ms";

  // Messages per response, at most 500. The server may return fewer, to keep
  // a response to a reasonable size.
  uint32 limit = 3;
}

message ConversationCursor {
  uint64 conversation_id = 1;

  reserved 2;
  reserved "after_seq";

  // Opaque. Returned by the server, stored by the client, sent back unchanged.
  //
  // It is a position in the order messages were *stored*, not their display
  // seq. Sequence numbers are taken before a message reaches the broker, and
  // two sends racing through different gateways can arrive in the other order:
  // a cursor at seq 10 would then skip a seq 9 stored a moment later. Storage
  // order has no such race, so nothing stored after a cursor can be behind it.
  bytes position = 3;
}

message SyncResponse {
  // In storage order within each conversation. Sort by seq for display.
  repeated Deliver messages = 1;

  // True when another request is needed. Paging is by cursor, never by
  // offset: an offset shifts under concurrent writes and silently repeats or
  // skips rows.
  bool has_more = 2;

  // Where each conversation that was read now stands. Store these and send
  // them next time; a conversation that returned nothing for this device can
  // still have moved -- a direct message encrypted only for the user's other
  // device -- and its cursor has to move with it.
  repeated ConversationCursor cursors = 3;
}

// ---------------------------------------------------------------- signals

// Read state is a cursor, not a per-message flag: one row per member holding
// the highest sequence read, moved forward with GREATEST so that receipts
// arriving out of order cannot move it backwards.
message ReadReceipt {
  uint64 conversation_id = 1;
  uint64 through_seq = 2;
}

// Lowest priority traffic in the system. Dropped first under load, and never
// stored.
message Typing {
  uint64 conversation_id = 1;
  bool active = 2;
}

// ---------------------------------------------------------------- shared

// Every reason the server refuses a frame. One list, shared by server and
// client, so a code can never be sent that the client has no case for.
// Whether a retry can succeed is carried separately, in Failure.retryable.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;

  // The frame itself.
  ERROR_CODE_FRAME_MALFORMED = 1;       // not a readable Frame; the socket is closed
  ERROR_CODE_INVALID = 2;               // readable, but breaks a rule; detail says which
  ERROR_CODE_NOT_IMPLEMENTED = 3;       // a frame type this server does not handle yet

  // The session.
  ERROR_CODE_PROTOCOL_VERSION = 10;     // Connect.protocol_version is not one this server speaks
  ERROR_CODE_TOKEN_INVALID = 11;        // sign in again
  ERROR_CODE_TOKEN_EXPIRED = 12;        // refresh the token and reconnect
  ERROR_CODE_NOT_CONNECTED = 13;        // send Connect first
  ERROR_CODE_ALREADY_CONNECTED = 14;    // one Connect per socket
  ERROR_CODE_CONNECT_TIMEOUT = 15;      // no valid Connect in time; the socket is closed

  // Sending.
  ERROR_CODE_NOT_A_MEMBER = 20;         // also returned for a conversation that does not exist
  ERROR_CODE_BLOCKED = 21;              // does not say which side blocked
  ERROR_CODE_ACCOUNT_INACTIVE = 22;
  ERROR_CODE_WRONG_CONTENT = 23;        // plaintext into a direct conversation, or ciphertext into a group
  ERROR_CODE_DEVICE_MISMATCH = 24;      // see Failure.device_mismatch
  ERROR_CODE_NO_RECIPIENT_DEVICES = 25; // nobody else in the conversation has a device

  // Capacity and availability; all retryable, with backoff.
  ERROR_CODE_UNAVAILABLE = 30;
  ERROR_CODE_NOT_DURABLE = 31;          // the broker did not confirm; retry under the same client_message_id
  ERROR_CODE_OVERLOADED = 32;
  ERROR_CODE_TOO_MANY_IN_FLIGHT = 33;
  ERROR_CODE_SYNC_IN_PROGRESS = 34;
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_TEXT = 1;
  MESSAGE_KIND_IMAGE = 2;
  MESSAGE_KIND_AUDIO = 3;
  MESSAGE_KIND_VIDEO = 4;
  // The body is a reference to object storage plus the key material needed to
  // read it; the bytes themselves never pass through this socket.
  MESSAGE_KIND_ATTACHMENT = 5;
  MESSAGE_KIND_SYSTEM = 6;
}
